name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            artifact: bondi-press-macOS
            ext: .app
          - os: windows-latest
            platform: windows/amd64
            artifact: bondi-press-Windows
            ext: .exe
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: bondi-press-Linux
            ext: ""

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      # ── checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── toolchain ─────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ── linux deps ────────────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # ── build ─────────────────────────────────────────────────────────────
      - name: Build app
        run: wails build -platform ${{ matrix.platform }} -trimpath -ldflags "-X main.appVersion=${{ github.ref_name }}"

      # ── package (linux tar, mac zip, windows zip) ─────────────────────────
      - name: Package — macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          zip -r -y ../../../${{ matrix.artifact }}.zip bondi-press.app

      - name: Package — Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build/bin
          7z a -tzip ../../../${{ matrix.artifact }}.zip *.exe

      - name: Package — Linux
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar czf ../../../${{ matrix.artifact }}.tar.gz *

      # ── upload artifact (always; release step picks these up) ──────────────
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  # ── Windows helper tools (libmspub + librsvg) ───────────────────────────────
  # Downloaded by the app on first-run setup, so they never bloat the main zip.
  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-librevenge
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-fontconfig
            autoconf automake libtool make tar xz curl zip

      # MSYS2 has no libmspub package, so build it (plus its pub2xhtml/pub2raw
      # tools) from the LibreOffice-hosted release tarball.
      - name: Build libmspub
        shell: msys2 {0}
        run: |
          curl -fL -o libmspub.tar.xz https://dev-www.libreoffice.org/src/libmspub-0.1.4.tar.xz
          tar xf libmspub.tar.xz
          cd libmspub-0.1.4
          ./configure --prefix=/mingw64 --disable-static --enable-shared \
            --disable-werror --without-docs --disable-tests \
            CXXFLAGS="-O2 -std=gnu++17 -include cstdint -fpermissive -w"
          make -j4
          make install
          ls /mingw64/bin | grep -i pub2

      - name: Collect tools + DLLs
        shell: msys2 {0}
        run: |
          mkdir -p tools/etc
          for exe in pub2xhtml pub2raw rsvg-convert; do
            cp /mingw64/bin/$exe.exe tools/
            ldd /mingw64/bin/$exe.exe | awk '/\/mingw64\//{print $3}' | while read dll; do cp -n "$dll" tools/; done
          done
          cp -r /mingw64/etc/fonts tools/etc/fonts
          ls -la tools
          (cd tools && zip -r ../bondi-tools-windows.zip .)

      - name: Smoke test (native Windows, no MSYS2 on PATH)
        shell: pwsh
        run: |
          $env:FONTCONFIG_PATH = "$PWD\tools\etc\fonts"
          $env:FONTCONFIG_FILE = "$PWD\tools\etc\fonts\fonts.conf"
          $pub = Get-ChildItem "demo-files\8-Page Brochure.pub" | Select-Object -First 1
          .\tools\pub2xhtml.exe $pub.FullName > out.xhtml
          if ((Get-Item out.xhtml).Length -lt 1000) { throw "pub2xhtml produced no output" }
          .\tools\pub2raw.exe $pub.FullName > out.raw
          if ((Get-Item out.raw).Length -lt 1000) { throw "pub2raw produced no output" }
          '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100"><text x="10" y="50" font-size="30" font-family="Arial">Bondi Press Aa</text></svg>' | Out-File -Encoding ascii t.svg
          .\tools\rsvg-convert.exe -o t.png t.svg
          if (-not (Test-Path t.png)) { throw "rsvg-convert failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: bondi-tools-windows
          path: |
            bondi-tools-windows.zip
            t.png

  # ── create github release from tags ─────────────────────────────────────────
  release:
    needs: [build, windows-tools]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            bondi-press-macOS/* bondi-press-Windows/* bondi-press-Linux/* bondi-tools-windows/bondi-tools-windows.zip
